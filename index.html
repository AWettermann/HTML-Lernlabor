<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML-Lernlabor V2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17233a;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe4ed;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:1.25rem}small,.muted{color:#64748b}.actions,.controls,.tabs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select,.filebtn{font:inherit;font-size:.87rem;background:white;color:#26334a;border:1px solid #cdd5e1;border-radius:8px;padding:9px 11px;cursor:pointer}button.primary{background:#df7824;color:white;border-color:#df7824;font-weight:700}button.active{background:#fff1e5;border-color:#df7824;color:#a34c0c}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffba78;outline-offset:1px}.filebtn input{display:none}main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:12px;padding:12px;height:calc(100dvh - 106px);min-height:500px}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:white;border:1px solid #dfe4ed;border-radius:12px;overflow:hidden}.panelhead{padding:9px 12px;border-bottom:1px solid #e3e8ef;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tabs{gap:0;background:#f8fafc;border-bottom:1px solid #e3e8ef}.tab{border:0;border-right:1px solid #e3e8ef;border-radius:0;background:transparent}.tab.active{background:white;color:#b75c12;border-bottom:3px solid #df7824;font-weight:700}.editorwrap{flex:1;min-height:0;position:relative;display:none}.editorwrap.active{display:flex}.lines{background:#f6f8fb;color:#9aa7b8;padding:14px 9px;text-align:right;font:13px/1.55 ui-monospace,Consolas,monospace;overflow:hidden;user-select:none;min-width:40px;white-space:pre}.editor{flex:1;width:100%;min-width:0;resize:none;border:0;padding:14px 10px;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2;outline:0;overflow:auto}.previewarea{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;background:#e9eef5;padding:12px;overflow:auto}.device{width:100%;max-width:100%;min-height:100%;background:white;box-shadow:0 4px 18px #27374a20;display:flex;flex-direction:column;transition:width .2s}.device.tablet{width:768px;flex:none}.device.phone{width:390px;flex:none}.device.desktop{width:100%}iframe{border:0;width:100%;flex:1;min-height:350px;background:white}.foot{border-top:1px solid #e3e8ef;padding:8px 12px;font-size:.8rem;color:#526078}.diagnostics{max-height:140px;overflow:auto;padding:9px 13px;font-size:.82rem;border-top:1px solid #e3e8ef}.diagnostics:empty{display:none}.diagnostics p{margin:4px 0}.warning{color:#a25100}.ok{color:#26764a}#previewTitle{font-weight:700}#name{max-width:170px}#help{font-size:.8rem;color:#64748b}dialog{border:1px solid #d7dce6;border-radius:12px;max-width:min(540px,95vw);padding:22px;box-shadow:0 20px 60px #17233a35}dialog::backdrop{background:#101a2d80}dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin-bottom:0}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.panel{height:52dvh;min-height:340px}header{align-items:flex-start}.previewarea{min-height:260px}}
</style></head><body><header><div><h1>🟠 HTML-Lernlabor <small>V2</small></h1><small>HTML · CSS · JavaScript – kostenlos, direkt im Browser</small></div><div class="actions"><input id="name" aria-label="Projektname" value="Meine erste Webseite" placeholder="Projektname"><button id="run" class="primary">▶ Vorschau</button><button id="save">Projekt speichern</button><label class="filebtn">Projekt öffnen<input id="open" type="file" accept=".json,application/json"></label><button id="export">HTML exportieren</button><button id="new">Neues Projekt</button></div></header><main><section class="panel"><div class="panelhead"><strong>Quellcode</strong><div class="controls"><label for="template">Vorlage:</label><select id="template"><option value="basic">HTML-Grundgerüst</option><option value="flex">Flexbox</option><option value="grid">CSS Grid</option><option value="responsive">Responsive Design</option><option value="animation">CSS-Animation</option></select><button id="apply">Vorlage laden</button></div></div><div class="tabs" role="tablist" aria-label="Dateien"><button class="tab active" data-tab="html">index.html</button><button class="tab" data-tab="css">style.css</button><button class="tab" data-tab="js">script.js</button></div><div class="editorwrap active" data-editor="html"><div class="lines" aria-hidden="true"></div><textarea id="html" class="editor" aria-label="HTML-Code" spellcheck="false"></textarea></div><div class="editorwrap" data-editor="css"><div class="lines" aria-hidden="true"></div><textarea id="css" class="editor" aria-label="CSS-Code" spellcheck="false"></textarea></div><div class="editorwrap" data-editor="js"><div class="lines" aria-hidden="true"></div><textarea id="js" class="editor" aria-label="JavaScript-Code" spellcheck="false"></textarea></div><div class="foot">Tab-Taste fügt zwei Leerzeichen ein · ⌘/Strg + Enter aktualisiert die Vorschau</div></section><section class="panel"><div class="panelhead"><span id="previewTitle">Webseiten-Vorschau</span><div class="controls" aria-label="Bildschirmgröße"><button class="devicebtn active" data-size="desktop">Desktop</button><button class="devicebtn" data-size="tablet">Tablet</button><button class="devicebtn" data-size="phone">Smartphone</button><button id="full">Vollbild</button></div></div><div id="previewarea" class="previewarea"><div id="device" class="device desktop"><iframe id="preview" title="Vorschau deiner Webseite" sandbox="allow-scripts allow-modals"></iframe></div></div><div id="diagnostics" class="diagnostics" aria-live="polite"></div><div class="foot" id="status" aria-live="polite">Bereit</div></section></main><dialog id="confirm"><h2 id="confirmTitle">Änderungen verwerfen?</h2><p id="confirmText">Nicht gespeicherte Änderungen gehen verloren.</p><menu><button id="cancel">Abbrechen</button><button class="primary" id="accept">Fortfahren</button></menu></dialog><script>
'use strict';
const $=id=>document.getElementById(id),keys=['html','css','js'];
const skeleton=(body,title='Meine erste Webseite')=>`<!DOCTYPE html>\n<html lang="de">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>${title}</title>\n</head>\n<body>\n${body}\n</body>\n</html>`;
const templates={basic:{html:skeleton('  <h1>Hallo Welt!</h1>\n  <p>Dies ist meine erste Webseite.</p>'),css:'/* Hier kannst du CSS schreiben. */',js:'// Hier kannst du JavaScript schreiben.'},flex:{html:skeleton('  <h1>Meine Flexbox</h1>\n  <div class="container">\n    <div class="karte">HTML</div>\n    <div class="karte">CSS</div>\n    <div class="karte">JavaScript</div>\n  </div>','Flexbox-Beispiel'),css:'body { font-family: system-ui; padding: 24px; }\n.container { display: flex; flex-wrap: wrap; gap: 16px; }\n.karte { flex: 1; min-width: 120px; padding: 30px; border-radius: 12px; background: #ffb35e; text-align: center; }',js:''},grid:{html:skeleton('  <h1>Mein CSS Grid</h1>\n  <div class="raster">\n    <header>Kopfbereich</header>\n    <nav>Navigation</nav>\n    <main>Inhalt</main>\n    <footer>Fußbereich</footer>\n  </div>','CSS Grid'),css:'body { font-family: system-ui; padding: 20px; }\n.raster { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }\n.raster > * { padding: 24px; border-radius: 10px; background: #dceafa; }\n.raster header, .raster footer { grid-column: 1 / -1; }',js:''},responsive:{html:skeleton('  <h1>Responsive Karten</h1>\n  <div class="karten">\n    <article>Eine Karte</article>\n    <article>Noch eine Karte</article>\n    <article>Dritte Karte</article>\n  </div>','Responsive Design'),css:'body { font-family: system-ui; padding: 24px; }\n.karten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }\narticle { padding: 28px; background: #ffe2bc; border-radius: 12px; }\n@media (max-width: 600px) { .karten { grid-template-columns: 1fr; } }',js:''},animation:{html:skeleton('  <h1>Meine CSS-Animation</h1>\n  <div class="ball"></div>','CSS-Animation'),css:'body { font-family: system-ui; padding: 30px; }\n.ball { width: 70px; height: 70px; border-radius: 50%; background: #e87924; animation: bewegen 2s ease-in-out infinite alternate; }\n@keyframes bewegen { from { transform: translateX(0); } to { transform: translateX(180px); } }\n@media (prefers-reduced-motion: reduce) { .ball { animation: none; } }',js:''}};
function data(){return Object.fromEntries(keys.map(k=>[k,$(k).value]))}function setData(d){keys.forEach(k=>$(k).value=d[k]??'');keys.forEach(updateLines)}function updateLines(k){const t=$(k),line=t.parentElement.querySelector('.lines');line.textContent=Array.from({length:Math.max(1,t.value.split('\n').length)},(_,i)=>i+1).join('\n');line.scrollTop=t.scrollTop}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function build(){const d=data();let h=d.html;const css='<style>\n'+d.css.replace(/<\/style/gi,'<\\/style')+'\n</style>';const js='<script>\n'+d.js.replace(/<\/script/gi,'<\\/script')+'\n<\/script>';h=/<\/head\s*>/i.test(h)?h.replace(/<\/head\s*>/i,()=>css+'\n</head>'):css+'\n'+h;h=/<\/body\s*>/i.test(h)?h.replace(/<\/body\s*>/i,()=>js+'\n</body>'):h+'\n'+js;return h}
function diagnose(){const d=data(),issues=[];if(!/<!doctype\s+html\s*>/i.test(d.html))issues.push('Die HTML5-Dokumenttypangabe fehlt.');if(!/<html\b/i.test(d.html)||!/<\/html\s*>/i.test(d.html))issues.push('Prüfe das öffnende und schließende html-Tag.');if(!/<head\b/i.test(d.html)||!/<\/head\s*>/i.test(d.html))issues.push('Prüfe den head-Bereich.');if(!/<body\b/i.test(d.html)||!/<\/body\s*>/i.test(d.html))issues.push('Prüfe den body-Bereich.');if(!/<title\b/i.test(d.html))issues.push('Ein title-Element fehlt.');const doc=new DOMParser().parseFromString(d.html,'text/html');if(doc.querySelector('parsererror'))issues.push('Der HTML-Code enthält möglicherweise einen Syntaxfehler.');const panel=$('diagnostics');panel.replaceChildren();const p=document.createElement('p');p.className=issues.length?'warning':'ok';p.textContent=issues.length?'Hinweise (keine vollständige Fehlerprüfung): '+issues.join(' '):'✓ Grundstruktur erkannt. Hinweis: Dies ist keine vollständige HTML-/CSS-Prüfung.';panel.append(p)}
function run(){ $('preview').srcdoc=build();diagnose();$('status').textContent='Vorschau aktualisiert · '+new Date().toLocaleTimeString('de-DE') }
function confirmAction(title,fn){$('confirmTitle').textContent=title;const dialog=$('confirm');if(typeof dialog.showModal==='function'){dialog.showModal();$('accept').onclick=()=>{dialog.close();fn()};}else if(confirm(title+' Nicht gespeicherte Änderungen gehen verloren.'))fn()}
$('cancel').onclick=()=>$('confirm').close();$('run').onclick=run;$('new').onclick=()=>confirmAction('Neues Projekt beginnen?',()=>{$('name').value='Meine erste Webseite';$('template').value='basic';setData(templates.basic);run()});$('apply').onclick=()=>confirmAction('Vorlage laden und aktuellen Code ersetzen?',()=>{setData(templates[$('template').value]);run()});$('save').onclick=()=>download('html-lernlabor-projekt.json',JSON.stringify({version:2,name:$('name').value,...data()},null,2),'application/json');$('export').onclick=()=>download('index.html',build(),'text/html;charset=utf-8');$('open').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!keys.every(k=>typeof d[k]==='string'))throw Error('HTML, CSS oder JavaScript fehlen.');confirmAction('Gespeichertes Projekt öffnen?',()=>{setData(d);$('name').value=typeof d.name==='string'?d.name:'Mein Projekt';run()})}catch(err){alert('Projekt konnte nicht geöffnet werden: '+err.message)}e.target.value=''};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',String(x===b))});document.querySelectorAll('[data-editor]').forEach(x=>x.classList.toggle('active',x.dataset.editor===b.dataset.tab));$(b.dataset.tab).focus()});keys.forEach(k=>{const t=$(k);t.addEventListener('input',()=>updateLines(k));t.addEventListener('scroll',()=>updateLines(k));t.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end');updateLines(k)}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();run()}})});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));$('device').className='device '+b.dataset.size});$('full').onclick=()=>{const node=$('previewarea');if(document.fullscreenElement)document.exitFullscreen();else if(node.requestFullscreen)node.requestFullscreen()};setData(templates.basic);run();
</script></body></html>
